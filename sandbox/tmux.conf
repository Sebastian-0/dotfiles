# The in-container tmux. Prefix C-Space, which clashes neither with a host tmux
# (C-b) nor readline (C-a).

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Detaching ends the container, killing claude mid-turn.
unbind d
unbind D

set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB,*:hyperlinks,xterm*:extkeys'
set -s extended-keys on
set -s set-clipboard on
set -g allow-passthrough on
set -s escape-time 10
set -g history-limit 50000
set -g mouse on
set -g focus-events on

set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Ctrl+Backspace reaches tmux as C-h, which claude reads as a plain Backspace;
# C-w deletes the word instead. Only in claude's pane (@claude, set by
# run-claude.sh), so shells and editors keep their C-h.
bind -n C-h if -F '#{@claude}' 'send-keys C-w' 'send-keys C-h'

set -g status-left "[claudesafe|#{session_name}|C-Space] "
set -g status-left-length 80

# Orange tells claudesafe's tmux from intui-sandbox's (blue) and a host one.
set -g status-style "bg=#c2410c,fg=white"
set -g pane-border-style "fg=#7c2d12"
set -g pane-active-border-style "fg=#f97316"
